
# Organizacion y proyecto en SonarQube Cloud
sonar.organization=dmoralesa14-ux
sonar.projectKey=dmoralesa14-ux_hotel-booking-acs-2026
sonar.projectName=hotel-booking-acs-2026
sonar.sourceEncoding=UTF-8

# Codigo fuente analizado: backend y frontend
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/coverage/**

# Archivos de prueba, para que no se cuenten como codigo de produccion
sonar.tests=backend,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/setupTests.js

# Reportes de cobertura generados por Jest y Vitest
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
